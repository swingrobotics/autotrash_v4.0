name: SWING Compute Worker Windows Build

on:
  push:
    branches:
      - main
    paths:
      - 'swing_compute/**'
      - 'autonomous_car/ai/**'
      - 'autonomous_car/simulation/validate_record_model_preview_v2.py'
      - 'autonomous_car/simulation/validate_temporal_gps_training_v2.py'
      - 'scripts/run_compute_worker.py'
      - 'scripts/run_compute_manager.py'
      - 'scripts/validate_record_preview_dashboard.py'
      - 'compute_worker_hmi.py'
      - 'record_model_preview_hmi.py'
      - 'requirements-compute-worker.txt'
      - 'requirements-ai-training.txt'
      - 'packaging/windows/**'
      - '.github/releases/compute-worker-version.txt'
      - '.github/workflows/compute-worker-windows.yml'
      - '.github/workflows/compute-worker-release.yml'
  pull_request:
    paths:
      - 'swing_compute/**'
      - 'autonomous_car/ai/**'
      - 'scripts/run_compute_worker.py'
      - 'scripts/run_compute_manager.py'
      - 'compute_worker_hmi.py'
      - 'requirements-compute-worker.txt'
      - 'requirements-ai-training.txt'
      - 'packaging/windows/**'

jobs:
  installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ai-training.txt
            requirements-compute-worker.txt

      - name: Install worker runtime and build tools
        run: python -m pip install -r requirements-compute-worker.txt

      - name: Compile and source smoke
        shell: pwsh
        run: |
          python -m compileall -q swing_compute autonomous_car scripts/run_compute_worker.py scripts/run_compute_manager.py
          python scripts/run_compute_worker.py --help
          python -c "import swing_compute.windows_manager as m; assert m.MANAGER_VERSION == '0.3.0'; print(m.MANAGER_VERSION)"

      - name: Validate temporal GPS and RECORD preview contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m autonomous_car.simulation.validate_temporal_gps_training_v2
          python -m autonomous_car.simulation.validate_record_model_preview_v2
          python scripts/validate_record_preview_dashboard.py

      - name: Build Worker and Manager executables
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name SWING-Compute-Worker `
            --collect-all openvino `
            --hidden-import autonomous_car.ai `
            scripts/run_compute_worker.py
          if (-not (Test-Path 'dist/SWING-Compute-Worker/SWING-Compute-Worker.exe')) { throw 'worker exe missing' }

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SWING-Compute-Manager `
            --exclude-module swing_compute.pipeline_worker `
            --exclude-module swing_compute.worker `
            --exclude-module autonomous_car `
            scripts/run_compute_manager.py
          if (-not (Test-Path 'dist/SWING-Compute-Manager.exe')) { throw 'manager exe missing' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content '.github/releases/compute-worker-version.txt' -Raw).Trim()
          if (-not $version) { throw 'Compute Worker version is empty' }
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${version}-dev" packaging/windows/SWINGComputeWorker.iss
          if (-not (Test-Path 'installer-dist/SWING-Compute-Worker-Setup.exe')) { throw 'setup exe missing' }
          Get-FileHash installer-dist/SWING-Compute-Worker-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SWING-Compute-Worker-Setup.exe" } |
            Out-File installer-dist/SWING-Compute-Worker-Setup.exe.sha256 -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SWING-Compute-Worker-Windows-main
          path: |
            installer-dist/SWING-Compute-Worker-Setup.exe
            installer-dist/SWING-Compute-Worker-Setup.exe.sha256
          if-no-files-found: error
