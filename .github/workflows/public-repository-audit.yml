name: Public Repository Audit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  public-data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked files for public data leaks
        run: python scripts/audit_public_repository.py
