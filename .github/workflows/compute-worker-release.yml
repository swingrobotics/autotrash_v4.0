name: SWING Compute Worker Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: false
        default: 0.4.0
  push:
    branches:
      - main
    paths:
      - '.github/releases/compute-worker-version.txt'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ai-training.txt
            requirements-compute-worker.txt

      - name: Install worker runtime and build tools
        run: python -m pip install -r requirements-compute-worker.txt

      - name: Compile and source smoke test
        shell: pwsh
        run: |
          python -m compileall -q swing_compute autonomous_car scripts/run_compute_worker.py scripts/run_compute_manager.py
          python scripts/run_compute_worker.py --help
          python -c "import swing_compute.windows_manager as m; assert m.MANAGER_VERSION == '0.3.0'; print(m.MANAGER_VERSION)"

      - name: Validate GPS temporal and RECORD preview contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m autonomous_car.simulation.validate_temporal_gps_training_v2
          python -m autonomous_car.simulation.validate_record_model_preview_v2
          python scripts/validate_record_preview_dashboard.py

      - name: Build Windows Worker executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name SWING-Compute-Worker `
            --collect-all openvino `
            --hidden-import autonomous_car.ai `
            scripts/run_compute_worker.py
          if (-not (Test-Path 'dist/SWING-Compute-Worker/SWING-Compute-Worker.exe')) {
            throw 'Worker executable was not produced'
          }

      - name: Build Windows Manager executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SWING-Compute-Manager `
            --exclude-module swing_compute.pipeline_worker `
            --exclude-module swing_compute.worker `
            --exclude-module autonomous_car `
            scripts/run_compute_manager.py
          if (-not (Test-Path 'dist/SWING-Compute-Manager.exe')) {
            throw 'Manager executable was not produced'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve installer version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = (Get-Content '.github/releases/compute-worker-version.txt' -Raw).Trim()
          }
          if (-not $version) { throw 'Release version is empty' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${{ steps.version.outputs.value }}" packaging/windows/SWINGComputeWorker.iss
          if (-not (Test-Path 'installer-dist/SWING-Compute-Worker-Setup.exe')) {
            throw 'Installer was not produced'
          }
          Get-FileHash installer-dist/SWING-Compute-Worker-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SWING-Compute-Worker-Setup.exe" } |
            Out-File installer-dist/SWING-Compute-Worker-Setup.exe.sha256 -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWING-Compute-Worker-Windows-${{ steps.version.outputs.value }}
          path: |
            installer-dist/SWING-Compute-Worker-Setup.exe
            installer-dist/SWING-Compute-Worker-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "compute-worker-v$version"
          @"
          ## SWING Compute Worker $version

          Windows Compute Worker installer built from `main`.

          - Adds synchronized RECORD model preview with H.264 dashboard playback.
          - Supports AUTO_GPS temporal training with recent IMU yaw-rate history.
          - Uses encoder-measured steering history for new temporal AUTO_GPS models instead of feeding model predictions back as vehicle state.
          - Preserves rare curve/recovery demonstrations and curve-aware training/validation metrics.
          - Includes AUTO_AI/AUTO_GPS training, ONNX export, model preview and Worker Manager in one installer.
          - Keeps vehicle motor authority on the rover; RECORD preview remains CONTROL NONE.
          "@ | Out-File release-notes.md -Encoding utf8

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              installer-dist/SWING-Compute-Worker-Setup.exe `
              installer-dist/SWING-Compute-Worker-Setup.exe.sha256 `
              --clobber `
              --repo '${{ github.repository }}'
          } else {
            gh release create $tag `
              installer-dist/SWING-Compute-Worker-Setup.exe `
              installer-dist/SWING-Compute-Worker-Setup.exe.sha256 `
              --target '${{ github.sha }}' `
              --title "SWING Compute Worker $version" `
              --notes-file release-notes.md `
              --repo '${{ github.repository }}'
          }
